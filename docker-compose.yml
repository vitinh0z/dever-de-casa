services:
  postgres:
    image: postgres:16-alpine
    container_name: dever-de-casa-postgres
    environment:
      POSTGRES_DB: deverdecasa
      POSTGRES_USER: deverdecasa
      POSTGRES_PASSWORD: deverdecasa
    ports:
      # Porta do host configuravel: defina POSTGRES_PORT no .env se a 5432 ja estiver em uso.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deverdecasa -d deverdecasa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
