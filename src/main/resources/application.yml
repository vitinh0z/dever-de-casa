# Padrões de desenvolvimento. Produção sobrescreve o que for sensível em
# application-prod.yml; ajustes pessoais vão em application-local.yml (fora do git).
spring:
  application:
    name: dever-de-casa
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:deverdecasa}
    username: ${POSTGRES_USER:deverdecasa}
    password: ${POSTGRES_PASSWORD:deverdecasa}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1h

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
